<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08080A" />
<meta name="robots" content="noindex" />
<title>404 — Juan Rafael</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%2308080A%22%2F%3E%3Cpath%20d%3D%22M20%2015v20a12%2012%200%200%200%2024%200V15%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%228.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2252%22%20r%3D%225%22%20fill%3D%22%23AA3CFF%22%2F%3E%3C%2Fsvg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --purple:#AA3CFF;--ink:#fff;--dim:#9A9AA4;
  --stroke:rgba(255,255,255,.11);--stroke-hi:rgba(170,60,255,.55);
  --card-hi:rgba(170,60,255,.08);
  --font-d:'Space Grotesk',system-ui,sans-serif;
  --font-b:'Inter',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-b);color:var(--ink);
  background:linear-gradient(180deg,#08080A 0%,#131316 100%);
  min-height:100vh;display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:6px}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;display:block;border-radius:50%;will-change:transform}
.a1{width:clamp(480px,72vmax,760px);height:clamp(480px,72vmax,760px);top:-16%;left:-14%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.055) 0%,rgba(255,255,255,.022) 32%,rgba(255,255,255,0) 70%);
  animation:d1 41s ease-in-out infinite alternate}
.a2{width:clamp(520px,80vmax,820px);height:clamp(520px,80vmax,820px);bottom:-26%;left:10%;
  background:radial-gradient(circle at 50% 50%,rgba(170,60,255,.07) 0%,rgba(170,60,255,.026) 36%,rgba(170,60,255,0) 72%);
  animation:d2 67s ease-in-out infinite alternate}
@keyframes d1{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-6vw,13vh,0)}}
@keyframes d2{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(-11vw,-4vh,0)}}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:2;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(255,255,255,.022) 2px,rgba(255,255,255,.022) 3px)}
main{position:relative;z-index:3;text-align:center;padding:40px 24px;max-width:640px}
.code{
  font-family:var(--font-d);font-weight:700;
  font-size:clamp(96px,22vw,220px);line-height:.86;letter-spacing:-.04em;margin:0;
  background:linear-gradient(180deg,#fff 0%,#8C8C95 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tag{font-family:var(--font-m);font-size:12px;letter-spacing:.2em;color:var(--dim);margin-top:18px}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);
  box-shadow:0 0 10px var(--purple);margin-right:10px;vertical-align:middle;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.85)}}
p.msg{color:var(--dim);font-size:15px;margin:22px 0 32px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;
  border:1px solid var(--stroke);border-radius:999px;
  font-family:var(--font-m);font-size:12px;letter-spacing:.06em;
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
.btn:hover{border-color:var(--stroke-hi);background:var(--card-hi);box-shadow:0 0 26px -8px rgba(170,60,255,.55)}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
  .aurora span{animation:none !important}
  .scanlines{display:none}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span></div>
<div class="scanlines" aria-hidden="true"></div>
<main>
  <h1 class="code">404</h1>
  <div class="tag"><i></i>ROUTE NOT FOUND</div>
  <p class="msg">That page isn't part of this system. It may have been moved, or it never existed.</p>
  <div class="links">
    <a class="btn" href="/">&#8592; BACK TO HOME</a>
    <a class="btn" href="https://github.com/UnoRfl" target="_blank" rel="noopener noreferrer">GITHUB &#8599;</a>
  </div>
</main>
</body>
</html>
